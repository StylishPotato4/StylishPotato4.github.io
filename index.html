const cats=[];DATA.forEach(d=>{if(!cats.includes(d.cat))cats.push(d.cat)});
let sel=null;
const chips=document.getElementById('chips');
function mk(label,val,n){const b=document.createElement('button');b.className='chip';b.type='button';b.innerHTML=label+' <i>'+n+'</i>';b.setAttribute('aria-pressed',String(sel===val));b.onclick=()=>{sel=sel===val?null:val;render()};return b}

function norm(s){return String(s).toLowerCase().replace(/ω/g,'').replace(/\s+/g,'')}
function render(){
  const q=norm(document.getElementById('q').value);
  const hit=DATA.filter(d=>!q||norm([d.name,d.desc,d.mpn,d.mfr,d.pkg,d.lcsc,d.cat].join(' ')).includes(q));
  chips.innerHTML='';chips.append(mk('すべて',null,hit.length));
  cats.forEach(c=>{const n=hit.filter(d=>d.cat===c).length;if(n)chips.append(mk(c,c,n))});

    const ds=d.desc&&d.desc!==d.name?`<div class="ds">${esc(d.desc)}</div>`:'';
